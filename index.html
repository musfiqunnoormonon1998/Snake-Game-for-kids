<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Serpent: Arcade Snake Game</title>
  <meta name="description" content="A sleek, modern dark-themed neon arcade Snake game with glowing visuals, fluid controls, audio synthesis, particle effects, and high scores. Fully playable offline." />
  <meta property="og:title" content="Neon Serpent: Arcade Snake Game" />
  <meta property="og:description" content="Play the sleek neon arcade Snake game offline or on GitHub Pages. Responsive, smooth controls, and arcade sound effects." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Inline SVG Favicon (No external asset network request needed) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'%3E%3Cpath d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.5a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5zm3.5-5.5a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5z'/%3E%3C/svg%3E" />

  <!-- Google Fonts with immediate robust offline fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    /* ====================================================
       1. CORE RESET & THEME STYLES (100% OFFLINE COMPLIANT)
    ==================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #07090e;
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(16, 185, 129, 0.09) 0%, transparent 60%),
        radial-gradient(circle at 85% 88%, rgba(6, 182, 212, 0.07) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      color: #e2e8f0;
      font-family: 'Chakra Petch', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ====================================================
       2. ARCADE CABINET CARD
    ==================================================== */
    .arcade-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    .arcade-cabinet {
      width: 100%;
      background: #0d1320;
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 20px;
      box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.18), 0 20px 45px -10px rgba(0, 0, 0, 0.85);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Header & Bar */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #34d399;
      font-size: 1.1rem;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }

    .brand-text {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #f1f5f9;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: #111a2d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .icon-btn:hover {
      background: #1a263d;
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
    }
    .icon-btn:active {
      transform: scale(0.96);
    }

    /* Scoreboard */
    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .score-card {
      background: #101827;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .score-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .score-val {
      font-size: 1.7rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: #10b981;
      text-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      margin-top: 2px;
      letter-spacing: -0.02em;
    }

    .score-val.high {
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Options Toolbar */
    .options-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #64748b;
      font-size: 0.72rem;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 700;
      transition: all 0.15s;
    }
    .chip-btn.active {
      background: rgba(6, 182, 212, 0.15);
      border-color: rgba(6, 182, 212, 0.4);
      color: #38bdf8;
    }
    .chip-btn.portal.active {
      background: rgba(168, 85, 247, 0.15);
      border-color: rgba(168, 85, 247, 0.4);
      color: #c084fc;
    }

    /* Canvas Arena */
    .arena-container {
      position: relative;
      width: 400px;
      height: 400px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(16, 185, 129, 0.35);
      box-shadow: inset 0 0 25px rgba(16, 185, 129, 0.08), 0 0 22px rgba(16, 185, 129, 0.18);
      background: #080c14;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Screen Overlays */
    .overlay-view {
      position: absolute;
      inset: 0;
      background: rgba(8, 12, 20, 0.88);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }

    .overlay-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #22d3ee;
      text-shadow: 0 0 16px rgba(34, 211, 238, 0.6);
      margin-bottom: 6px;
    }

    .overlay-title.danger {
      color: #f43f5e;
      text-shadow: 0 0 16px rgba(244, 63, 94, 0.6);
    }

    .overlay-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 22px;
      line-height: 1.45;
      max-width: 290px;
    }

    .action-button {
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      color: #041017;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      font-family: inherit;
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.45);
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    }
    .action-button:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
    }
    .action-button:active {
      transform: translateY(1px);
    }

    .pause-fab {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(16, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .pause-fab:hover {
      background: rgba(30, 41, 59, 0.9);
      color: #38bdf8;
    }

    /* Virtual Tactile D-Pad */
    .dpad-container {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 48px);
      gap: 8px;
      justify-content: center;
    }

    .dpad-btn {
      background: #111a2e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 1.3rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: all 0.1s;
    }
    .dpad-btn:active {
      background: #10b981;
      color: #041017;
      transform: scale(0.94);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
    }

    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }

    /* Screen shake on crash */
    .shake-anim {
      animation: shake-kf 0.32s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake-kf {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 4px); }
      40% { transform: translate(5px, -4px); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(3px, -2px); }
      100% { transform: translate(0, 0); }
    }

    /* Footer */
    footer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #475569;
      text-align: center;
      padding: 10px 0;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="arcade-wrapper">
    <div class="arcade-cabinet" id="arcadeCabinet">
      
      <!-- Header -->
      <div class="header-bar">
        <div class="brand-title">
          <div class="brand-icon">⚡</div>
          <span class="brand-text">NEON SERPENT</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="soundBtn" aria-label="Toggle Sound">
            <span id="soundIcon">🔊</span>
          </button>
        </div>
      </div>

      <!-- Scoreboard -->
      <div class="scoreboard">
        <div class="score-card">
          <div class="score-header">
            <span>Score</span>
            <span id="applesCount" style="color: #64748b;">0 apples</span>
          </div>
          <div class="score-val" id="currentScore">0</div>
        </div>
        <div class="score-card">
          <div class="score-header">
            <span>Best</span>
            <span id="highRecordTag" style="color: #38bdf8; display: none;">NEW!</span>
          </div>
          <div class="score-val high" id="highScore">0</div>
        </div>
      </div>

      <!-- Difficulty & Mode Selector -->
      <div class="options-bar">
        <div class="option-group">
          <span>SPEED:</span>
          <button class="chip-btn" id="diffChill">Chill</button>
          <button class="chip-btn active" id="diffClassic">Classic</button>
          <button class="chip-btn" id="diffHyper">Hyper</button>
        </div>
        <div class="option-group">
          <span>WALLS:</span>
          <button class="chip-btn active" id="wallToggle">Solid</button>
        </div>
      </div>

      <!-- Canvas Area -->
      <div class="arena-container" id="arenaContainer">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button class="pause-fab" id="pauseFab" title="Pause Game (Space)" style="display: none;">❚❚</button>

        <!-- Dynamic Overlay -->
        <div class="overlay-view" id="overlay">
          <h2 class="overlay-title" id="overlayTitle">READY TO HUNT?</h2>
          <p class="overlay-desc" id="overlayDesc">
            Pilot the neon serpent using <b>Arrow Keys</b>, <b>WASD</b>, or the touch controls below.
          </p>
          <button class="action-button" id="startBtn">START GAME</button>
        </div>
      </div>

      <!-- Virtual D-Pad for Mobile & Touch devices -->
      <div class="dpad-container">
        <div class="dpad-grid">
          <button class="dpad-btn d-up" id="btnUp" aria-label="Move Up">▲</button>
          <button class="dpad-btn d-left" id="btnLeft" aria-label="Move Left">◀</button>
          <button class="dpad-btn d-down" id="btnDown" aria-label="Move Down">▼</button>
          <button class="dpad-btn d-right" id="btnRight" aria-label="Move Right">▶</button>
        </div>
      </div>

    </div>
  </div>

  <footer>
    NEON SERPENT • OFFLINE & GITHUB PAGES READY • 100% SELF-CONTAINED
  </footer>

  <!-- ====================================================
       3. STANDALONE MODERN JAVASCRIPT GAME ENGINE
  ==================================================== -->
  <script>
    (function () {
      'use strict';

      // Dimensions & Canvas
      const GRID = 20;
      const CANVAS_BASE = 400;
      const CELL = CANVAS_BASE / GRID; // 20px

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const currentScoreEl = document.getElementById('currentScore');
      const highScoreEl = document.getElementById('highScore');
      const applesCountEl = document.getElementById('applesCount');
      const highRecordTag = document.getElementById('highRecordTag');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayDesc = document.getElementById('overlayDesc');
      const startBtn = document.getElementById('startBtn');
      const soundBtn = document.getElementById('soundBtn');
      const soundIcon = document.getElementById('soundIcon');
      const pauseFab = document.getElementById('pauseFab');
      const arcadeCabinet = document.getElementById('arcadeCabinet');
      const wallToggle = document.getElementById('wallToggle');
      const diffChill = document.getElementById('diffChill');
      const diffClassic = document.getElementById('diffClassic');
      const diffHyper = document.getElementById('diffHyper');

      // High-DPI support
      function setupCanvasDPI() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = CANVAS_BASE * dpr;
        canvas.height = CANVAS_BASE * dpr;
        ctx.resetTransform && ctx.resetTransform();
        ctx.scale(dpr, dpr);
      }
      setupCanvasDPI();
      window.addEventListener('resize', setupCanvasDPI);

      // Safe LocalStorage accessor (runs seamlessly under file:// and strict iframe sandbox)
      function getStorage(key, fallback) {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? val : fallback;
        } catch (e) {
          return fallback;
        }
      }
      function setStorage(key, val) {
        try {
          localStorage.setItem(key, String(val));
        } catch (e) {}
      }

      // High score initial load
      let highScore = parseInt(getStorage('neon_snake_highscore', '0'), 10);
      highScoreEl.textContent = highScore;

      // Sound synthesizer with Web Audio API (zero audio files needed)
      let isMuted = getStorage('neon_snake_muted', 'false') === 'true';
      soundIcon.textContent = isMuted ? '🔇' : '🔊';

      let audioCtx = null;
      function playTone(freq, type, duration, vol) {
        if (isMuted) return;
        try {
          const AudioC = window.AudioContext || window.webkitAudioContext;
          if (!AudioC) return;
          if (!audioCtx) audioCtx = new AudioC();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const now = audioCtx.currentTime;

          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(vol || 0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch (err) {}
      }

      function sndEat() {
        playTone(480, 'triangle', 0.1, 0.25);
        setTimeout(() => playTone(880, 'sine', 0.08, 0.18), 30);
      }
      function sndBonus() {
        playTone(587.33, 'triangle', 0.12, 0.28);
        setTimeout(() => playTone(1174.66, 'sine', 0.18, 0.22), 60);
      }
      function sndTurn() {
        playTone(280, 'sine', 0.025, 0.04);
      }
      function sndCrash() {
        playTone(120, 'sawtooth', 0.35, 0.3);
        playTone(60, 'square', 0.4, 0.2);
      }
      function sndStart() {
        playTone(330, 'triangle', 0.08, 0.18);
        setTimeout(() => playTone(440, 'triangle', 0.08, 0.18), 70);
        setTimeout(() => playTone(660, 'triangle', 0.14, 0.18), 140);
      }

      soundBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        setStorage('neon_snake_muted', isMuted);
        soundIcon.textContent = isMuted ? '🔇' : '🔊';
      });

      // Game State Variables
      let snake = [{ x: 10, y: 12 }, { x: 10, y: 13 }, { x: 10, y: 14 }];
      let direction = { x: 0, y: -1 };
      let inputQueue = [];
      let food = { x: 10, y: 6 };
      let bonusFood = null; // { x, y, timeLeft, maxTime }
      let particles = [];
      let floatingScores = [];
      let score = 0;
      let applesEaten = 0;
      let isRunning = false;
      let isPaused = false;
      let lastTickTime = 0;
      let difficulty = 'classic'; // 'chill' | 'classic' | 'hyper'
      let isPortalMode = false;   // false = solid walls, true = wrap around

      // Difficulty buttons
      function setDifficulty(d) {
        if (isRunning) return;
        difficulty = d;
        [diffChill, diffClassic, diffHyper].forEach(b => b.classList.remove('active'));
        if (d === 'chill') diffChill.classList.add('active');
        if (d === 'classic') diffClassic.classList.add('active');
        if (d === 'hyper') diffHyper.classList.add('active');
      }
      diffChill.addEventListener('click', () => setDifficulty('chill'));
      diffClassic.addEventListener('click', () => setDifficulty('classic'));
      diffHyper.addEventListener('click', () => setDifficulty('hyper'));

      // Wall Mode toggle
      wallToggle.addEventListener('click', () => {
        if (isRunning) return;
        isPortalMode = !isPortalMode;
        if (isPortalMode) {
          wallToggle.textContent = 'Portal';
          wallToggle.classList.add('portal');
        } else {
          wallToggle.textContent = 'Solid';
          wallToggle.classList.remove('portal');
        }
      });

      // Tick speed calculation
      function getTickInterval() {
        if (difficulty === 'chill') return 145;
        if (difficulty === 'hyper') return Math.max(42, 75 - Math.floor(score / 40) * 4);
        return Math.max(55, 110 - Math.floor(score / 30) * 4);
      }

      // Random empty grid cell
      function getRandomCell() {
        const occ = new Set(snake.map(p => `${p.x},${p.y}`));
        if (bonusFood) occ.add(`${bonusFood.x},${bonusFood.y}`);
        const free = [];
        for (let x = 0; x < GRID; x++) {
          for (let y = 0; y < GRID; y++) {
            if (!occ.has(`${x},${y}`)) free.push({ x, y });
          }
        }
        return free[Math.floor(Math.random() * free.length)] || { x: 5, y: 5 };
      }

      // Spark particles
      function addSparks(gridX, gridY, color, count) {
        const px = (gridX + 0.5) * CELL;
        const py = (gridY + 0.5) * CELL;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4 - 0.2);
          const spd = Math.random() * 3.2 + 1.2;
          particles.push({
            x: px,
            y: py,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            color: color,
            alpha: 1.0,
            decay: Math.random() * 0.03 + 0.025
          });
        }
      }

      // Floating score popup
      function addScorePopup(text, gridX, gridY, color) {
        floatingScores.push({
          text: text,
          x: (gridX + 0.5) * CELL,
          y: (gridY + 0.3) * CELL,
          alpha: 1.0,
          color: color || '#34d399'
        });
      }

      // Safe input queue to prevent self-collision on fast cornering
      function queueDirection(newDir) {
        if (!isRunning || isPaused) return;
        const last = inputQueue.length ? inputQueue[inputQueue.length - 1] : direction;
        // Disallow 180° reverse
        if (newDir.x === -last.x && newDir.y === -last.y) return;
        if (newDir.x === last.x && newDir.y === last.y) return;
        if (inputQueue.length < 2) {
          inputQueue.push(newDir);
          sndTurn();
        }
      }

      // Start new game
      function startGame() {
        snake = [{ x: 10, y: 12 }, { x: 10, y: 13 }, { x: 10, y: 14 }];
        direction = { x: 0, y: -1 };
        inputQueue = [];
        particles = [];
        floatingScores = [];
        bonusFood = null;
        score = 0;
        applesEaten = 0;
        currentScoreEl.textContent = '0';
        applesCountEl.textContent = '0 apples';
        highRecordTag.style.display = 'none';
        food = getRandomCell();

        isRunning = true;
        isPaused = false;
        overlay.style.display = 'none';
        pauseFab.style.display = 'flex';
        lastTickTime = performance.now();
        sndStart();
      }

      // Pause toggle
      function togglePause() {
        if (!isRunning) return;
        isPaused = !isPaused;
        if (isPaused) {
          overlayTitle.textContent = 'SYSTEM PAUSED';
          overlayTitle.className = 'overlay-title';
          overlayDesc.textContent = 'Press Space or Resume to continue mission.';
          startBtn.textContent = 'RESUME';
          overlay.style.display = 'flex';
        } else {
          overlay.style.display = 'none';
          lastTickTime = performance.now();
        }
      }

      // Game Over trigger
      function gameOver() {
        isRunning = false;
        pauseFab.style.display = 'none';
        sndCrash();

        // Screen shake
        arcadeCabinet.classList.add('shake-anim');
        setTimeout(() => arcadeCabinet.classList.remove('shake-anim'), 340);

        // Crash sparks
        addSparks(snake[0].x, snake[0].y, '#f43f5e', 26);

        // High score check & store
        let isNewHigh = false;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          setStorage('neon_snake_highscore', highScore);
          isNewHigh = true;
          highRecordTag.style.display = 'inline';
        }

        overlayTitle.textContent = 'SIGNAL LOST';
        overlayTitle.className = 'overlay-title danger';
        overlayDesc.innerHTML = `Final Score: <b>${score}</b> • Energy Harvested: <b>${applesEaten}</b>${
          isNewHigh ? '<br><span style="color:#fbbf24; font-weight:bold;">★ NEW HIGH RECORD! ★</span>' : ''
        }`;
        startBtn.textContent = 'PLAY AGAIN';
        overlay.style.display = 'flex';
      }

      // Game tick logic
      function update() {
        if (inputQueue.length > 0) {
          const next = inputQueue.shift();
          if (!(next.x === -direction.x && next.y === -direction.y)) {
            direction = next;
          }
        }

        const head = snake[0];
        let nextX = head.x + direction.x;
        let nextY = head.y + direction.y;

        // Wall boundary check
        if (isPortalMode) {
          if (nextX < 0) nextX = GRID - 1;
          else if (nextX >= GRID) nextX = 0;
          if (nextY < 0) nextY = GRID - 1;
          else if (nextY >= GRID) nextY = 0;
        } else {
          if (nextX < 0 || nextX >= GRID || nextY < 0 || nextY >= GRID) {
            gameOver();
            return;
          }
        }

        const eatsNormal = nextX === food.x && nextY === food.y;
        const eatsBonus = bonusFood && nextX === bonusFood.x && nextY === bonusFood.y;

        // Self collision check
        const checkSegments = (eatsNormal || eatsBonus) ? snake : snake.slice(0, -1);
        for (let i = 0; i < checkSegments.length; i++) {
          if (checkSegments[i].x === nextX && checkSegments[i].y === nextY) {
            gameOver();
            return;
          }
        }

        const newHead = { x: nextX, y: nextY };
        snake.unshift(newHead);

        if (eatsNormal) {
          score += 10;
          applesEaten += 1;
          currentScoreEl.textContent = score;
          applesCountEl.textContent = `${applesEaten} apples`;
          sndEat();
          addSparks(nextX, nextY, '#10b981', 18);
          addScorePopup('+10', nextX, nextY, '#34d399');

          // Spawn special bonus fruit every 5 apples
          if (applesEaten % 5 === 0 && !bonusFood) {
            const bCell = getRandomCell();
            bonusFood = { x: bCell.x, y: bCell.y, timeLeft: 6.0, maxTime: 6.0 };
          }

          food = getRandomCell();
        } else if (eatsBonus) {
          score += 50;
          currentScoreEl.textContent = score;
          sndBonus();
          addSparks(nextX, nextY, '#fbbf24', 24);
          addScorePopup('+50 STAR!', nextX, nextY, '#fbbf24');
          bonusFood = null;
        } else {
          snake.pop();
        }
      }

      // Main Render & Animation Loop
      function render(now) {
        const dt = (now - (render.lastTime || now)) / 1000;
        render.lastTime = now;

        if (isRunning && !isPaused) {
          if (now - lastTickTime >= getTickInterval()) {
            update();
            lastTickTime = now;
          }
          if (bonusFood) {
            bonusFood.timeLeft -= dt;
            if (bonusFood.timeLeft <= 0) bonusFood = null;
          }
        }

        // Clear canvas
        ctx.fillStyle = '#080c14';
        ctx.fillRect(0, 0, CANVAS_BASE, CANVAS_BASE);

        // Subtle grid lines
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.45)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID; i++) {
          const pos = i * CELL;
          ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, CANVAS_BASE); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(CANVAS_BASE, pos); ctx.stroke();
        }

        // Draw Portal boundary line if active
        if (isPortalMode) {
          ctx.strokeStyle = 'rgba(168, 85, 247, 0.35)';
          ctx.lineWidth = 2;
          ctx.strokeRect(1, 1, CANVAS_BASE - 2, CANVAS_BASE - 2);
        }

        // Draw Normal Food (Glowing Pulsing Apple)
        const pulse = Math.sin(now * 0.008) * 0.15 + 0.85;
        const fx = (food.x + 0.5) * CELL;
        const fy = (food.y + 0.5) * CELL;
        const fr = (CELL * 0.38) * pulse;

        ctx.save();
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 18 * pulse;
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(fx, fy, fr, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#6ee7b7';
        ctx.beginPath();
        ctx.arc(fx - 2, fy - 2, fr * 0.45, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(fx, fy - fr);
        ctx.quadraticCurveTo(fx + 3, fy - fr - 4, fx + 2, fy - fr - 6);
        ctx.stroke();
        ctx.restore();

        // Draw Bonus Golden Starfruit if spawned
        if (bonusFood) {
          const bx = (bonusFood.x + 0.5) * CELL;
          const by = (bonusFood.y + 0.5) * CELL;
          const br = (CELL * 0.42) * (Math.sin(now * 0.012) * 0.2 + 0.9);

          ctx.save();
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 20;

          // Countdown ring
          const prog = bonusFood.timeLeft / bonusFood.maxTime;
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.3)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(bx, by, CELL * 0.48, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(bx, by, CELL * 0.48, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * prog, false);
          ctx.stroke();

          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(bx, by, br, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(bx - 2, by - 2, br * 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Draw Snake
        snake.forEach((seg, i) => {
          const isHead = i === 0;
          const segX = seg.x * CELL;
          const segY = seg.y * CELL;
          const pad = isHead ? 1.5 : 2;

          ctx.save();
          if (isHead) {
            ctx.shadowColor = '#06b6d4';
            ctx.shadowBlur = 14;

            const grad = ctx.createLinearGradient(segX, segY, segX + CELL, segY + CELL);
            grad.addColorStop(0, '#22d3ee');
            grad.addColorStop(1, '#06b6d4');
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.roundRect(segX + pad, segY + pad, CELL - pad * 2, CELL - pad * 2, 6);
            ctx.fill();

            // Eyes looking in direction of travel
            const ex = segX + CELL / 2;
            const ey = segY + CELL / 2;
            let e1X = ex, e1Y = ey, e2X = ex, e2Y = ey;

            if (direction.x === 1) {
              e1X = segX + CELL - 5; e1Y = segY + 6;
              e2X = segX + CELL - 5; e2Y = segY + CELL - 6;
            } else if (direction.x === -1) {
              e1X = segX + 5; e1Y = segY + 6;
              e2X = segX + 5; e2Y = segY + CELL - 6;
            } else if (direction.y === -1) {
              e1X = segX + 6; e1Y = segY + 5;
              e2X = segX + CELL - 6; e2Y = segY + 5;
            } else {
              e1X = segX + 6; e1Y = segY + CELL - 5;
              e2X = segX + CELL - 6; e2Y = segY + CELL - 5;
            }

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(e1X, e1Y, 2.2, 0, Math.PI * 2);
            ctx.arc(e2X, e2Y, 2.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#080c14';
            ctx.beginPath();
            ctx.arc(e1X + direction.x * 0.6, e1Y + direction.y * 0.6, 1.2, 0, Math.PI * 2);
            ctx.arc(e2X + direction.x * 0.6, e2Y + direction.y * 0.6, 1.2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            const alpha = 0.5 + 0.5 * (1 - i / snake.length);
            ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
            ctx.beginPath();
            ctx.roundRect(segX + pad, segY + pad, CELL - pad * 2, CELL - pad * 2, 4);
            ctx.fill();
          }
          ctx.restore();
        });

        // Update & Render Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.95;
          p.vy *= 0.95;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Update & Render Floating Score Popups
        for (let i = floatingScores.length - 1; i >= 0; i--) {
          const fs = floatingScores[i];
          fs.y -= 0.6;
          fs.alpha -= 0.025;

          if (fs.alpha <= 0) {
            floatingScores.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = fs.alpha;
          ctx.font = 'bold 12px "JetBrains Mono", monospace';
          ctx.fillStyle = fs.color;
          ctx.shadowColor = fs.color;
          ctx.shadowBlur = 8;
          ctx.textAlign = 'center';
          ctx.fillText(fs.text, fs.x, fs.y);
          ctx.restore();
        }

        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);

      // Keyboard Controls
      window.addEventListener('keydown', e => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
          e.preventDefault();
        }

        if (e.code === 'Space' || e.code === 'KeyP') {
          if (!isRunning) startGame();
          else togglePause();
          return;
        }

        switch (e.code) {
          case 'ArrowUp':
          case 'KeyW':
            queueDirection({ x: 0, y: -1 });
            break;
          case 'ArrowDown':
          case 'KeyS':
            queueDirection({ x: 0, y: 1 });
            break;
          case 'ArrowLeft':
          case 'KeyA':
            queueDirection({ x: -1, y: 0 });
            break;
          case 'ArrowRight':
          case 'KeyD':
            queueDirection({ x: 1, y: 0 });
            break;
        }
      });

      // Overlay button
      startBtn.addEventListener('click', () => {
        if (!isRunning) startGame();
        else togglePause();
      });

      pauseFab.addEventListener('click', togglePause);

      // On-Screen D-Pad
      document.getElementById('btnUp').addEventListener('click', () => queueDirection({ x: 0, y: -1 }));
      document.getElementById('btnDown').addEventListener('click', () => queueDirection({ x: 0, y: 1 }));
      document.getElementById('btnLeft').addEventListener('click', () => queueDirection({ x: -1, y: 0 }));
      document.getElementById('btnRight').addEventListener('click', () => queueDirection({ x: 1, y: 0 }));

      // Touch Swipe Gestures on Arena
      let tStartX = 0;
      let tStartY = 0;
      canvas.addEventListener('touchstart', e => {
        if (e.touches.length > 0) {
          tStartX = e.touches[0].clientX;
          tStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      canvas.addEventListener('touchend', e => {
        if (e.changedTouches.length === 0) return;
        const dx = e.changedTouches[0].clientX - tStartX;
        const dy = e.changedTouches[0].clientY - tStartY;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        if (Math.max(absX, absY) > 22) {
          if (absX > absY) {
            queueDirection(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
          } else {
            queueDirection(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
          }
        }
      }, { passive: true });

    })();
  </script>
</body>
</html>
